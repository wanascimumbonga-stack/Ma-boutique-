<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma boutique – vitrine</title>
<meta name="description" content="Habits, chaussures, sacs et beauté : trouve un produit et commande sur WhatsApp ou Nuvalk.">
<meta name="theme-color" content="#FFB703">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="logo-192.png">
<style>
:root{--bg:#F5F7FA;--card:#FFFFFF;--ink:#0F2A43;--mute:#5E7388;--line:#DCE4EC;--chip:#E8EDF3;--accent:#FFB703;--accent-ink:#0F2A43;--ok:#14855C;--bad:#C43B3B;--c1:#2E6DA4;--c2:#B87400;--bd:#1F6FD6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1620;--card:#13242F;--ink:#EAF1F7;--mute:#92A7B8;--line:#24394A;--chip:#1B3042;--ok:#38C48F;--bad:#F07A7A;--c1:#4C94D8;--c2:#C48600;--bd:#3B8CF0}}
:root[data-theme="dark"]{--bg:#0B1620;--card:#13242F;--ink:#EAF1F7;--mute:#92A7B8;--line:#24394A;--chip:#1B3042;--ok:#38C48F;--bad:#F07A7A;--c1:#4C94D8;--c2:#C48600;--bd:#3B8CF0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
[hidden]{display:none!important}
a{color:inherit}
h1,h2{line-height:1.2}
h1{font-size:22px;margin:16px 0 8px}
h2{font-size:17px;margin:24px 0 8px}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;font:inherit;font-weight:700;font-size:18px;color:var(--ink);cursor:pointer;padding:0;min-height:44px}
.brand img{width:30px;height:30px;border-radius:8px}
.sell{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 18px;min-height:44px;font:inherit;font-weight:700;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:12px 16px 56px;outline:none}
.banner{background:var(--card);border-bottom:2px solid var(--accent);padding:10px 16px;font-size:14px;text-align:center}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.go{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;padding:0 16px;min-height:48px;cursor:pointer}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;min-height:48px}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips[hidden]{display:none}
.cf{width:100%;margin-top:12px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 12px}
.pays{display:grid;grid-template-columns:1fr;gap:8px}
.payrow .pnum{margin-top:6px}
.payl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.cp{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.rvf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rvf .full{grid-column:1/-1}
.rvt{font-weight:700;margin:8px 0}
.field label.pay{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--card);font-weight:400}
.field label.pay input{width:20px;height:20px;min-height:0;padding:0;flex:none}
.chip.sub{min-height:38px;font-size:14px;padding:0 13px}
.ctiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.ctile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;min-height:92px;font:inherit;font-weight:700;cursor:pointer}
.ctile .em{font-size:26px;line-height:1}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:0 16px;min-height:44px;font:inherit;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{display:block;text-decoration:none;color:inherit}
.ph{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.price{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px}
.ct{padding:6px 2px 0}
.ct b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.ct small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.card:focus-visible .ph{outline:3px solid var(--accent);outline-offset:2px}
.sk .ph{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk .ph{animation:none}}
.empty{color:var(--mute);padding:28px 4px;text-align:center}
.empty h1{color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:10px;padding:0 16px;min-height:50px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn.wa{background:var(--ok);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--ink)}
.btn.sm{width:auto;min-height:44px;margin-top:0;padding:0 14px;font-size:14px}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;padding:10px 0;min-height:44px;cursor:pointer}
.back{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;padding:0;min-height:44px;cursor:pointer}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:14px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img,.gal .none{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:var(--chip);width:100%}
.gcount{text-align:center;color:var(--mute);font-size:13px;margin-top:6px}
.pprice{font-size:26px;font-weight:700;margin:2px 0}
.meta{color:var(--mute);margin:2px 0}
.desc{white-space:pre-wrap;margin:12px 0}
.seller{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.note{color:var(--mute);font-size:14px;margin:8px 0}
.tip{background:var(--card);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:16px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs .chip{flex:1}
.field{margin-top:12px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.field small{display:block;color:var(--mute);margin-top:4px}
.row2{display:flex;gap:8px}
.row2 .field{flex:1}
.row2 .field.cur{flex:0 0 96px}
.err{color:var(--bad);font-weight:700;min-height:22px;margin-top:10px;font-size:15px}
.ok{color:var(--ok);font-weight:700}
.mine{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}

.mine .t{flex:1;min-width:0}
.mine .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.st{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--ok);color:#fff}
.st.sold{background:var(--mute)}
.pth{display:flex;gap:8px;flex-wrap:wrap}
.pt{position:relative;width:84px;height:104px;border-radius:10px;overflow:hidden;background:var(--chip)}
.pt img{width:100%;height:100%;object-fit:cover}
.pt button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:18px;cursor:pointer}
.pt button::after{content:"";position:absolute;inset:-6px}
.pt .cov{position:absolute;left:4px;bottom:4px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:6px;padding:0 6px}
.addph{display:flex;align-items:center;justify-content:center;width:84px;height:104px;border:2px dashed var(--mute);border-radius:10px;color:var(--mute);font-size:30px;cursor:pointer;background:none}
.addph:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.addph input{position:absolute;opacity:0;width:1px;height:1px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;font-size:15px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:28px;line-height:1.1}
.tile span{display:block;font-weight:700;font-size:14px}
.tile small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.hd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.hd .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.hd small{display:block;color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
.hd a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{margin:32px 0 0;text-align:center;color:var(--mute);font-size:13px}

.cta{display:block;text-align:center;margin-top:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;border-radius:10px;padding:8px 6px}
.order{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2px solid var(--accent);padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.order .in{max-width:720px;margin:0 auto}
.order .ot{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.order .orow{display:flex;gap:8px;margin-top:6px}
.order .btn{margin-top:0;flex:1;min-width:0}
.order .onote{margin:6px 0 0;font-size:13px;color:var(--mute)}
.has-order main{padding-bottom:170px}
.has-order .toast{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.b1{fill:var(--c1)}.b2{fill:var(--c2)}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:4px 0 0}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block;color:var(--ink);margin-top:8px}
.chart text{fill:currentColor;font-family:inherit}
.chart .ax{stroke:var(--line)}
.lnk{color:var(--bd);font-weight:600;text-decoration:underline}
.vf{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;font-weight:700;color:var(--ink)}
.vb{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.vb .s{fill:var(--bd);stroke:var(--bd);stroke-width:1.2;stroke-linejoin:round}
.vb .c{fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.une{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;border-radius:999px;padding:2px 10px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--accent);color:var(--accent-ink);font-weight:700}
</style>
</head>

};

function catName(k){var a=CATS.concat(LEGACY);for(var i=0;i<a.length;i++)if(a[i][0]===k)return a[i][1];return "";}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function copy(text){
  function fb(){var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(e){}document.body.removeChild(ta);return ok;}

function waNum(n){

/* ---------- Photos ---------- */
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var M=900,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error("Photo illisible."));},"image/jpeg",0.8);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Cette photo ne peut pas être lue. Essaie-en une autre."));};
    img.src=url;
  });
}

function renderAuth(mode){
  var login=mode==="login";
  var h='<h1 tabindex="-1" id="ptitle">'+(login?"Connexion vendeur":"Créer un compte vendeur")+'</h1>';
  h+='<div class="tabs" role="group"><button class="chip" data-m="login" aria-pressed="'+login+'">Se connecter</button><button class="chip" data-m="signup" aria-pressed="'+!login+'">Créer un compte</button></div>';
  h+='<form id="af" novalidate>';
  if(!login)h+=field("fn","Nom affiché aux acheteurs","text",'autocomplete="name" maxlength="60"');
  h+=field("fe","E-mail","email",'autocomplete="email" inputmode="email"');
  h+=field("fp","Mot de passe","password",'autocomplete="'+(login?"current-password":"new-password")+'"',login?"":"6 caractères minimum.");
  if(!login){
    h+=field("fw","Numéro WhatsApp","tel",'autocomplete="tel" inputmode="tel" maxlength="20" placeholder="+243 812 345 678"',"Avec l'indicatif du pays.");
    h+=field("fv","Nom d'utilisateur Nuvalk (facultatif)","text",'autocapitalize="none" maxlength="40" placeholder="@toi"');
    h+=cityField("fc","");
    h+='<p class="note">Ton nom, ta ville, ton WhatsApp et ton nom Nuvalk seront visibles par tous les acheteurs. Il te faut au moins un des deux contacts.</p>';
  }
  h+='<div class="err" id="ferr" role="alert"></div><button class="btn" id="fgo" type="submit">'+(login?"Se connecter":"Créer mon compte")+'</button></form>';
  if(login)h+='<p class="note"><a class="lnk" href="#/oubli">Mot de passe oublié ?</a></p>';
  view.innerHTML=h;
  $("ptitle").focus({preventScroll:true});
  if(!login)wireCity("fc");
  view.querySelector(".tabs").onclick=function(e){var b=e.target.closest("[data-m]");if(b)renderAuth(b.getAttribute("data-m"));};
  $("af").onsubmit=async function(e){
    e.preventDefault();
    var email=$("fe").value.trim(),pw=$("fp").value,err=$("ferr");err.textContent="";
    if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent="Écris une adresse e-mail valide.";$("fe").focus();return;}
    if(pw.length<6){err.textContent="Le mot de passe doit avoir au moins 6 caractères.";$("fp").focus();return;}
    var f={email:email,password:pw};
    if(!login){
      f.name=$("fn").value.trim();f.nuvalk=nvName($("fv").value);f.city=getCity("fc");
      var raw=$("fw").value.trim();f.whatsapp=raw?waNum(raw):"";
      if(f.name.length<2){err.textContent="Écris le nom qui sera affiché (2 lettres minimum).";$("fn").focus();return;}
      if(raw&&!f.whatsapp){err.textContent="Numéro WhatsApp invalide. Écris-le avec l'indicatif, par exemple +243 812 345 678.";$("fw").focus();return;}
      if(!f.whatsapp&&!f.nuvalk){err.textContent="Ajoute ton WhatsApp ou ton nom Nuvalk pour que les acheteurs puissent te contacter.";$("fw").focus();return;}
    }
    var btn=$("fgo");btn.disabled=true;btn.textContent="Un instant…";
    try{
      var r=login?await API.login(email,pw):await API.signup(f);
      if(r.needsConfirm){view.innerHTML='<div class="empty"><h1>Vérifie ton e-mail</h1><p>Un message de confirmation a été envoyé à '+esc(email)+'. Ouvre le lien qu\'il contient, puis reviens te connecter.</p></div>';return;}
      cur=await API.me();updateBar();toast(login?"Connecté.":"Compte créé. Tu peux vendre.");
      if(location.hash==="#/compte")showAccount(routeId);else location.hash="#/compte";
    }catch(ex){err.textContent=friendly(ex);btn.disabled=false;btn.textContent=login?"Se connecter":"Créer mon compte";}
  };
}
function showForgot(){
  var h='<h1 tabindex="-1" id="ptitle">Mot de passe oublié</h1>';
  if(RECERR){h+='<p class="err" role="alert">Ce lien a expiré ou a déjà servi. Demande-en un nouveau ci-dessous.</p>';RECERR=false;}
  h+='<p class="note">Écris l\'e-mail de ton compte. Nous t\'envoyons un lien pour choisir un nouveau mot de passe.</p>';
  h+='<form id="rf" novalidate>'+field("re","E-mail","email",'autocomplete="email" inputmode="email"');
  h+='<div class="err" id="rerr" role="alert"></div><button class="btn" id="rgo" type="submit">Envoyer le lien</button></form>';
  h+='<p class="note"><a class="lnk" href="#/compte">Retour à la connexion</a></p>';
  view.innerHTML=h;
  $("ptitle").focus({preventScroll:true});
  $("rf").onsubmit=async function(e){
    e.preventDefault();
    var email=$("re").value.trim(),err=$("rerr");err.textContent="";
    if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent="Écris une adresse e-mail valide.";$("re").focus();return;}
    var btn=$("rgo");btn.disabled=true;btn.textContent="Un instant…";
    try{
      await API.recover(email);
      view.innerHTML='<div class="empty"><h1>Vérifie ton e-mail</h1><p>Si un compte existe avec '+esc(email)+', un lien vient d\'être envoyé. Ouvre-le avec Chrome. Pense à regarder aussi dans les spams.</p><p><a class="lnk" href="#/compte">Retour à la connexion</a></p></div>';
    }catch(ex){err.textContent=friendly(ex);btn.disabled=false;btn.textContent="Envoyer le lien";}
  };
}
function showReset(){
  if(!RECOV){view.innerHTML='<div class="empty"><h1>Lien invalide</h1><p>Ce lien a expiré ou a déjà servi.</p><p><a class="lnk" href="#/oubli">Demander un nouveau lien</a></p></div>';return;}
  var h='<h1 tabindex="-1" id="ptitle">Nouveau mot de passe</h1>';
  h+='<form id="nf" novalidate>'+field("n1","Nouveau mot de passe","password",'autocomplete="new-password"',"6 caractères minimum.")+field("n2","Répète le mot de passe","password",'autocomplete="new-password"');
  h+='<div class="err" id="nerr" role="alert"></div><button class="btn" id="ngo" type="submit">Enregistrer</button></form>';
  view.innerHTML=h;
  $("ptitle").focus({preventScroll:true});
  $("nf").onsubmit=async function(e){
    e.preventDefault();
    var a=$("n1").value,b=$("n2").value,err=$("nerr");err.textContent="";
    if(a.length<6){err.textContent="Le mot de passe doit avoir au moins 6 caractères.";$("n1").focus();return;}
    if(a!==b){err.textContent="Les deux mots de passe ne sont pas identiques.";$("n2").focus();return;}
    var btn=$("ngo");btn.disabled=true;btn.textContent="Un instant…";
    try{
      await API.resetPassword(RECOV,a);RECOV=null;
      cur=await API.me();updateBar();toast("Mot de passe changé. Tu es connecté.");location.hash="#/compte";
    }catch(ex){
      if(ex.status===401||ex.status===403||/expired|invalid|jwt/i.test(ex.message||"")){RECOV=null;showReset();return;}
      err.textContent=friendly(ex);btn.disabled=false;btn.textContent="Enregistrer";
    }
  };
}
async function showAccount(rid){
  if(!cur){renderAuth("login");return;}
  view.innerHTML=loading();
  try{if(!cur.profile){var m=await API.me();if(rid!==routeId)return;if(!m){saveSession(null);cur=null;updateBar();renderAuth("login");return;}cur=m;}}
  catch(e){if(rid!==routeId)return;if(e.status===401||e.status===403){saveSession(null);cur=null;updateBar();renderAuth("login");return;}view.innerHTML=errBox(friendly(e));$("retry").onclick=function(){showAccount(rid);};return;}
  var list=[];
  try{list=await API.mine();}catch(e){if(rid!==routeId)return;view.innerHTML=errBox(friendly(e));$("retry").onclick=function(){showAccount(rid);};return;}
  if(rid!==routeId)return;
  var adm=false;try{adm=await API.isAdmin();}catch(e){}
  if(rid!==routeId)return;
  var pr=cur.profile||{};
  var h='<h1 tabindex="-1" id="ptitle">Bonjour '+esc(pr.name||"")+'</h1>';
  if(pr.verified)h+='<div class="vf">'+VB+' Ton compte est vérifié</div>';
  h+='<a class="btn" href="#/nouveau">Vendre un produit</a>';
  h+='<button class="btn alt" id="shop">Partager ma boutique</button>';
  h+='<h2>Mes produits ('+list.length+')</h2>';
  h+=list.length?list.map(function(p){
    var im=safeUrl(p.photos&&p.photos[0]);
    return '<div class="mine"><a href="#/p/'+encodeURIComponent(p.id)+'">'+(im?'<img src="'+im+'" alt="">':'<div class="thumb"></div>')+'</a><div class="t"><b>'+esc(p.title)+'</b><div class="meta">'+esc(money(p))+' · <span class="st'+(p.status==="sold"?' sold':'')+'">'+(p.status==="sold"?"Vendu":"En vente")+'</span>'+(isFeat(p)?' <span class="tag">À la une</span>':'')+'</div><div class="acts"><a class="btn alt sm" href="#/modifier/'+encodeURIComponent(p.id)+'">Modifier</a><button class="btn alt sm" data-tg="'+esc(p.id)+'" data-s="'+p.status+'">'+(p.status==="sold"?"Remettre en vente":"Marquer vendu")+'</button><button class="btn alt sm" data-rm="'+esc(p.id)+'">Supprimer</button></div></div></div>';
  }).join(""):'<p class="note">Tu n\'as pas encore de produit en vente.</p>';
  h+='<h2>Mon profil de vendeur</h2><form id="pf" novalidate>'+field("pn","Nom affiché","text",'maxlength="60" value="'+esc(pr.name||"")+'"')+field("pw","Numéro WhatsApp","tel",'inputmode="tel" maxlength="20" value="'+esc(pr.whatsapp||"")+'" placeholder="+243 812 345 678"',"Avec l'indicatif du pays.")+field("pv","Nom d'utilisateur Nuvalk","text",'autocapitalize="none" maxlength="40" value="'+esc(pr.nuvalk||"")+'" placeholder="@toi"')+cityField("pc",pr.city)+payField(pr.payments)+'<div class="err" id="perr" role="alert"></div><button class="btn alt" type="submit">Enregistrer mon profil</button></form>';
  h+='<h2>Outils</h2>'+(adm?'<a class="btn" href="#/admin">Espace propriétaire</a>':'')+'<a class="btn alt" href="cahier.html">Mon cahier : ventes, stock, dettes</a><button class="btn alt" id="out">Se déconnecter</button>';
  view.innerHTML=h;
  $("ptitle").focus({preventScroll:true});
  view.onclick=async function(e){
    var tg=e.target.closest("[data-tg]"),rm=e.target.closest("[data-rm]");
    if(tg){
      tg.disabled=true;
      try{await API.update(tg.getAttribute("data-tg"),{status:tg.getAttribute("data-s")==="sold"?"active":"sold"});S.loaded=false;showAccount(routeId);}catch(ex){toast(friendly(ex));tg.disabled=false;}
    }else if(rm){
      if(rm.getAttribute("data-c")!=="1"){rm.setAttribute("data-c","1");rm.textContent="Confirmer";rm.classList.add("bad");setTimeout(function(){if(rm.isConnected){rm.removeAttribute("data-c");rm.textContent="Supprimer";rm.classList.remove("bad");}},4000);return;}
      var id=rm.getAttribute("data-rm"),old=list.filter(function(x){return x.id===id;})[0];
      rm.disabled=true;
      try{await API.remove(id);if(old)API.drop(old.photos||[]);S.loaded=false;toast("Produit supprimé.");showAccount(routeId);}catch(ex){toast(friendly(ex));rm.disabled=false;}
    }
  };
  wireCity("pc");wirePay();
  $("shop").onclick=function(){shareShop(cur.id,(cur.profile&&cur.profile.name)||"");};
  $("pf").onsubmit=async function(e){
    e.preventDefault();
    var err=$("perr");err.textContent="";
    var name=$("pn").value.trim(),raw=$("pw").value.trim(),w=raw?waNum(raw):"",nvv=nvName($("pv").value);
    if(name.length<2){err.textContent="Écris le nom affiché (2 lettres minimum).";return;}
    if(raw&&!w){err.textContent="Numéro WhatsApp invalide. Écris-le avec l'indicatif, par exemple +243 812 345 678.";return;}
    if(!w&&!nvv){err.textContent="Garde au moins un moyen de contact : WhatsApp ou Nuvalk.";return;}
    try{var np=await API.saveProfile({name:name,whatsapp:w,nuvalk:nvv,city:getCity("pc"),payments:getPay()});if(np)cur.profile=np;S.loaded=false;toast("Profil enregistré.");}
    catch(ex){err.textContent=friendly(ex);}
  };
  $("out").onclick=async function(){await API.logout();cur=null;updateBar();S.loaded=false;toast("Déconnecté.");location.hash="#/";};
}

/* ---------- Formulaire produit ---------- */
var F=null;
function paintPhotos(){
  var h=F.photos.map(function(p,i){return '<div class="pt"><img src="'+esc(p.url||p.preview)+'" alt="Photo '+(i+1)+'">'+(i===0?'<span class="cov">Couverture</span>':'')+'<button type="button" data-rp="'+i+'" aria-label="Retirer la photo '+(i+1)+'">×</button></div>';}).join("");
  if(F.photos.length<MAXPH)h+='<label class="addph" aria-label="Ajouter des photos">+<input id="pin" type="file" accept="image/*" multiple></label>';
  $("pth").innerHTML=h;
  if($("pin"))$("pin").onchange=async function(){
    var files=Array.prototype.slice.call(this.files||[],0,MAXPH-F.photos.length),err=$("ferr");err.textContent="";
    for(var i=0;i<files.length;i++){try{var b=await compress(files[i]);F.photos.push({blob:b,preview:URL.createObjectURL(b)});}catch(ex){err.textContent=friendly(ex);}}
    paintPhotos();
  };
}
async function showForm(id,rid){
  if(!cur){location.hash="#/compte";return;}
  F={id:id,photos:[],busy:false};
  var p=null;
  if(id){
    view.innerHTML=loading();
    try{p=await API.get(id);}catch(e){if(rid!==routeId)return;view.innerHTML=errBox(friendly(e));$("retry").onclick=function(){showForm(id,rid);};return;}
    if(rid!==routeId)return;
    if(!p||p.seller.id!==cur.id){view.innerHTML=notFound();return;}
    F.photos=p.photos.map(function(u){return{url:u};});F.orig=p.photos.slice();
  }
  var h='<button class="back" id="back">← Retour</button><h1 tabindex="-1" id="ptitle">'+(p?"Modifier le produit":"Vendre un produit")+'</h1><form id="pfm" novalidate>';
  h+='<div class="field"><label>Photos (1 à '+MAXPH+')</label><div class="pth" id="pth"></div><small>La première photo est la couverture. Photographie l\'article en pleine lumière.</small></div>';
  h+=field("ft","Nom du produit","text",'maxlength="80" value="'+esc(p?p.title:"")+'" placeholder="Ex. Robe wax fleurie"');
  h+='<div class="field"><label for="fk">Catégorie</label><select id="fk">'+CATS.concat(p&&p.category==="autres"?LEGACY:[]).map(function(c){return '<option value="'+c[0]+'"'+(p&&p.category===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join("")+'</select></div>';
  h+='<div class="field"><label for="fsb">Sous-catégorie (facultatif)</label><select id="fsb"></select></div>';
  h+='<div class="row2"><div class="field"><label for="fpr">Prix</label><input id="fpr" inputmode="decimal" value="'+(p?esc(String(p.price).replace(".",",")):"")+'" placeholder="Ex. 25000"></div><div class="field cur"><label for="fcu">Monnaie</label><select id="fcu"><option value="FC"'+(p&&p.currency==="FC"?' selected':'')+'>FC</option><option value="USD"'+(p&&p.currency==="USD"?' selected':'')+'>$</option></select></div></div>';
  h+=field("fs","Tailles ou pointures (facultatif)","text",'maxlength="60" value="'+esc(p?p.sizes:"")+'" placeholder="Ex. S, M, L ou 38 à 44"');
  h+='<div class="field"><label for="fd">Description (facultatif)</label><textarea id="fd" maxlength="1000" placeholder="État, couleur, matière, livraison…">'+esc(p?p.description:"")+'</textarea></div>';
  h+='<div class="err" id="ferr" role="alert"></div><button class="btn" id="fgo" type="submit">'+(p?"Enregistrer les changements":"Publier le produit")+'</button></form>';
  view.innerHTML=h;
  $("ptitle").focus({preventScroll:true});
  $("back").onclick=function(){history.back();};
  function paintSubs(cur0){
    var ss=SUBS[$("fk").value]||[],o='<option value="">Choisir…</option>';
    ss.forEach(function(n){o+='<option value="'+esc(n)+'"'+(cur0===n?' selected':'')+'>'+esc(n)+'</option>';});
    $("fsb").innerHTML=o;$("fsb").disabled=!ss.length;
  }
  paintSubs(p?p.subcategory:"");
  $("fk").onchange=function(){paintSubs("");};
  paintPhotos();
  $("pth").onclick=function(e){var b=e.target.closest("[data-rp]");if(!b)return;F.photos.splice(+b.getAttribute("data-rp"),1);paintPhotos();};
  $("pfm").onsubmit=async function(e){
    e.preventDefault();if(F.busy)return;
    var err=$("ferr");err.textContent="";
    var title=$("ft").value.trim(),price=parseFloat(String($("fpr").value).replace(/\s/g,"").replace(",","."));
    if(!F.photos.length){err.textContent="Ajoute au moins une photo.";return;}
    if(title.length<2){err.textContent="Écris le nom du produit.";$("ft").focus();return;}
    if(!(price>0)){err.textContent="Écris le prix du produit.";$("fpr").focus();return;}
    F.busy=true;var btn=$("fgo");btn.disabled=true;
    var urls=[],uploaded=[],nNew=F.photos.filter(function(x){return !x.url;}).length,done=0;
    try{
      for(var i=0;i<F.photos.length;i++){
        var ph=F.photos[i];
        if(ph.url){urls.push(ph.url);continue;}
        btn.textContent="Envoi des photos ("+(++done)+"/"+nNew+")…";
        var u=await API.upload(ph.blob);uploaded.push(u);urls.push(u);
      }
      btn.textContent="Publication…";
      var data={title:title,description:$("fd").value.trim(),price:price,currency:$("fcu").value,category:$("fk").value,subcategory:$("fsb").value,sizes:$("fs").value.trim(),photos:urls};
      var saved;
      if(p){saved=await API.update(p.id,data);if(!saved)throw new Error("Impossible d'enregistrer. Réessaie.");
        var gone=(F.orig||[]).filter(function(o){return urls.indexOf(o)<0;});if(gone.length)API.drop(gone);}
      else saved=await API.create(data);
      S.loaded=false;toast(p?"Changements enregistrés.":"Produit publié.");
      location.hash="#/p/"+encodeURIComponent(saved.id);
    }catch(ex){
      if(uploaded.length)API.drop(uploaded);
      err.textContent=friendly(ex);F.busy=false;btn.disabled=false;btn.textContent=p?"Enregistrer les changements":"Publier le produit";
    }
  };
}

/* ---------- Espace propriétaire ---------- */
function dstr(ts){return new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});}
function dayLbl(x){return new Date(x+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");}
function chartSvg(daily){
  var mx=1;daily.forEach(function(x){mx=Math.max(mx,x.visitors,x.orders);});
  var H=104,top=18,gw=320/7,bw=14,g='<line class="ax" x1="0" x2="320" y1="'+(top+H)+'" y2="'+(top+H)+'"/>',alt=[];
  daily.forEach(function(x,i){
    var cx=gw*i+gw/2;
    [[x.visitors,"b1",cx-bw-1],[x.orders,"b2",cx+1]].forEach(function(v){
      var h=v[0]?Math.max(3,Math.round(H*v[0]/mx)):0;
      if(h)g+='<rect class="'+v[1]+'" x="'+v[2]+'" y="'+(top+H-h)+'" width="'+bw+'" height="'+h+'" rx="3"/>';
      if(v[0])g+='<text x="'+(v[2]+bw/2)+'" y="'+(top+H-h-4)+'" font-size="10" text-anchor="middle">'+v[0]+'</text>';
    });
    g+='<text x="'+cx+'" y="'+(top+H+16)+'" font-size="11" text-anchor="middle">'+esc(dayLbl(x.day))+'</text>';
    alt.push(dayLbl(x.day)+" : "+x.visitors+" visiteur(s), "+x.orders+" commande(s) lancée(s)");
  });
  return '<svg class="chart" viewBox="0 0 320 '+(top+H+24)+'" role="img" aria-label="'+esc("Visiteurs et commandes lancées sur 7 jours. "+alt.join(". "))+'">'+g+'</svg>'+
    '<div class="lg"><span><i style="background:var(--c1)"></i>Visiteurs</span><span><i style="background:var(--c2)"></i>Commandes lancées</span></div>';
}
var RVS=[["featured","À la une"],["badge","Badge vérifié"],["banner","Bannière"],["autre","Autre"]];
var RVM=["Orange Money","M-Pesa","Airtel Money","Afrimoney","Espèces","Autre"];
function rvLabel(k){for(var i=0;i<RVS.length;i++)if(RVS[i][0]===k)return RVS[i][1];return k;}
function sumBy(list){var t={USD:0,CDF:0};list.forEach(function(r){t[r.currency==="CDF"?"CDF":"USD"]+=Number(r.amount)||0;});return t;}
function totTxt(t){var a=[];if(t.USD)a.push(money({price:t.USD,currency:"USD"}));if(t.CDF)a.push(money({price:t.CDF,currency:"CDF"}));return a.length?a.join(" + "):"0 $";}
function revenueHtml(d){
  var h='<h2>Mes revenus</h2>';
  if(d.revenues===null){return h+'<p class="note">Le carnet de revenus n\'est pas encore prêt : exécute <b>migration-v11.sql</b> dans Supabase.</p>';}
  var rv=d.revenues||[],mk=new Date().toISOString().slice(0,7),month=rv.filter(function(r){return String(r.paid_at).slice(0,7)===mk;});
  h+='<div class="tiles"><div class="tile"><b style="font-size:20px">'+esc(totTxt(sumBy(month)))+'</b><span>Ce mois</span><small>'+month.length+' paiement'+(month.length>1?"s":"")+'</small></div><div class="tile"><b style="font-size:20px">'+esc(totTxt(sumBy(rv)))+'</b><span>Total depuis le début</span><small>'+rv.length+' paiement'+(rv.length>1?"s":"")+'</small></div></div>';
  h+='<p class="rvt">Ajouter un paiement reçu</p><div class="rvf">'+
    '<div class="field"><label for="rvs">Service</label><select id="rvs">'+RVS.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label for="rvn">Vendeur</label><input id="rvn" type="text" maxlength="80" list="rvl" placeholder="Nom"><datalist id="rvl">'+d.profiles.slice(0,100).map(function(x){return '<option value="'+esc(x.name||"")+'">';}).join("")+'</datalist></div>'+
    '<div class="field"><label for="rva">Montant</label><input id="rva" type="number" inputmode="decimal" min="0" step="any" placeholder="Ex. 5"></div>'+
    '<div class="field"><label for="rvc">Devise</label><select id="rvc"><option value="USD">Dollars ($)</option><option value="CDF">Francs (FC)</option></select></div>'+
    '<div class="field"><label for="rvm">Reçu par</label><select id="rvm">'+RVM.map(function(x){return '<option>'+x+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label for="rvd">Date</label><input id="rvd" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div>'+
    '<div class="field full"><label for="rvt">Note (facultatif)</label><input id="rvt" type="text" maxlength="150" placeholder="Ex. 7 jours à la une"></div></div>'+
    '<div class="err" id="rverr" role="alert"></div><button class="btn" id="rvgo" type="button">Enregistrer ce paiement</button>';
  h+=rv.slice(0,30).map(function(r){return '<div class="hd"><div class="t"><span>'+esc(rvLabel(r.kind))+(r.seller_label?' · '+esc(r.seller_label):'')+'</span><span>'+esc(money({price:r.amount,currency:r.currency}))+'</span></div><small>'+esc([dstr(r.paid_at),r.method,r.note].filter(Boolean).join(" · "))+'</small><div class="acts"><button class="btn alt sm" data-rd="'+esc(r.id)+'">Supprimer</button></div></div>';}).join("")||'<p class="note">Aucun paiement noté pour le moment.</p>';
  return h;
}
function payStatsHtml(d,st){
  var cnt={},num={};
  d.profiles.forEach(function(p){var m=payMap(p.payments);for(var k in m){cnt[k]=(cnt[k]||0)+1;if(m[k])num[k]=(num[k]||0)+1;}});
  var by=st.pay_copy_by||{},h='<h2>Moyens de paiement</h2>';
  h+=PAY.map(function(p){var c=by[p[0]]||0;return '<div class="hd"><div class="t"><span>'+esc(p[1])+'</span><span>'+(cnt[p[0]]||0)+(cnt[p[0]]>1?' vendeurs':' vendeur')+'</span></div>'+(MOBILE.indexOf(p[0])>=0?'<small>'+(num[p[0]]||0)+' avec numéro affiché · '+c+' copie'+(c>1?'s':'')+' du numéro (7 jours)</small>':'')+'</div>';}).join("");
  h+='<p class="note">« Copie du numéro » = un acheteur a appuyé sur Copier. Ce n\'est pas un paiement confirmé, mais ça montre quels moyens les acheteurs utilisent. Ces chiffres serviront de preuve auprès d\'un opérateur ou d\'un agrégateur de paiement.</p>';
  return h;
}
async function showAdmin(rid,keep){
  if(!cur){location.hash="#/compte";return;}
  view.innerHTML=loading();
  var ok=false;try{ok=await API.isAdmin();}catch(e){}
  if(rid!==routeId)return;
  if(!ok){view.innerHTML='<div class="empty"><h1>Accès réservé</h1><p>Cette page est réservée au propriétaire de la vitrine.</p><a class="btn" href="#/" style="max-width:260px;margin:12px auto 0">Retour à la vitrine</a></div>';return;}
  var d=null;
  try{d=await API.adminData();}catch(e){if(rid!==routeId)return;view.innerHTML=errBox(friendly(e));$("retry").onclick=function(){showAdmin(rid);};return;}
  if(rid!==routeId)return;
  var st=d.stats||{},prof={},per={};
  d.profiles.forEach(function(x){prof[x.id]=x;});
  d.products.forEach(function(x){per[x.seller_id]=(per[x.seller_id]||0)+1;});
  var ord=(st.orders_wa_7d||0)+(st.orders_nv_7d||0);
  var h='<button class="back" id="back">← Retour</button><h1 tabindex="-1" id="ptitle">Espace propriétaire</h1>';
  if(!REMOTE)h+='<p class="note">Aperçu en mode démonstration : tu vois ce que contient ce téléphone. Une fois la vitrine connectée à Supabase, seul le propriétaire voit cette page, avec les chiffres de tout le monde.</p>';
  h+='<div class="tiles">'+
    '<div class="tile"><b>'+(st.visitors_today||0)+'</b><span>Visiteurs aujourd\'hui</span><small>appareils différents</small></div>'+
    '<div class="tile"><b>'+(st.visitors_7d||0)+'</b><span>Visiteurs, 7 jours</span><small>appareils différents</small></div>'+
    '<div class="tile"><b>'+(st.sellers_total||0)+'</b><span>Vendeurs inscrits</span><small>+'+(st.sellers_7d||0)+' cette semaine</small></div>'+
    '<div class="tile"><b>'+(st.products_active||0)+'</b><span>Produits en vente</span><small>'+(st.products_sold||0)+' marqués vendus</small></div>'+
    '<div class="tile"><b>'+(st.views_7d||0)+'</b><span>Fiches ouvertes</span><small>7 derniers jours</small></div>'+
    '<div class="tile"><b>'+ord+'</b><span>Commandes lancées</span><small>'+(st.orders_wa_7d||0)+' WhatsApp · '+(st.orders_nv_7d||0)+' Nuvalk</small></div></div>';
  h+='<h2>7 derniers jours</h2>'+chartSvg(st.daily&&st.daily.length?st.daily:[]);
  h+='<p class="note">Un visiteur = un téléphone ou navigateur, compté une fois par jour. Une commande lancée = un clic sur « Commander » : la vente, le paiement et la livraison se font sur WhatsApp ou Nuvalk, donc tu vois l\'intérêt des acheteurs, pas les ventes réelles. Les acheteurs n\'ont pas de compte : seuls les vendeurs sont des inscrits.</p>';
  h+=revenueHtml(d);
  h+=payStatsHtml(d,st);
  var bc=st.by_category||{},cl=CATS.concat(LEGACY).filter(function(c){return bc[c[0]];});
  h+='<h2>Produits par catégorie</h2>'+(cl.length?cl.map(function(c){return '<div class="hd"><div class="t"><span>'+esc(c[1])+'</span><span>'+bc[c[0]]+'</span></div></div>';}).join(""):'<p class="note">Aucun produit en vente.</p>');
  h+='<h2>Produits les plus regardés</h2>'+((st.top&&st.top.length)?st.top.map(function(x,i){return '<a class="hd" style="display:block;text-decoration:none" href="#/p/'+encodeURIComponent(x.id)+'"><div class="t"><span>'+(i+1)+'. '+esc(x.title)+'</span><span>'+x.views+(x.views>1?' vues':' vue')+'</span></div></a>';}).join(""):'<p class="note">Pas encore de vues cette semaine.</p>');
  h+='<h2>Vendeurs ('+d.profiles.length+')</h2>';
  h+=d.profiles.slice(0,100).map(function(x){
    var n=per[x.id]||0,num=waNum(x.whatsapp);
    var contact=[num?'<a target="_blank" rel="noopener" href="https://wa.me/'+num+'">WhatsApp +'+esc(num)+'</a>':'',x.nuvalk?'Nuvalk @'+esc(nvName(x.nuvalk)):''].filter(Boolean).join(" · ");
    return '<div class="hd"><div class="t"><span>'+esc(x.name||"Vendeur")+(x.verified?" "+VB:"")+'</span><span>'+n+(n>1?' produits':' produit')+'</span></div><small>'+esc([x.city,'inscrit le '+dstr(x.created_at)].filter(Boolean).join(" · "))+'</small><small>'+(contact||'Aucun contact')+'</small><div class="acts"><button class="btn alt sm" data-vf="'+esc(x.id)+'" data-v="'+(x.verified?'0':'1')+'">'+(x.verified?'✔ Retirer le badge':'Vérifier ce vendeur')+'</button></div></div>';
  }).join("")||'<p class="note">Aucun vendeur pour le moment.</p>';
  h+='<h2>Tous les produits ('+d.products.length+')</h2>';
  h+=d.products.slice(0,100).map(function(x){
    var im=safeUrl(x.photos&&x.photos[0]),s=prof[x.seller_id]||{};
    return '<div class="mine"><a href="#/p/'+encodeURIComponent(x.id)+'">'+(im?'<img src="'+im+'" alt="">':'<div class="thumb"></div>')+'</a><div class="t"><b>'+esc(x.title)+'</b><div class="meta">'+esc(money(x))+' · <span class="st'+(x.status==="sold"?' sold':'')+'">'+(x.status==="sold"?"Vendu":"En vente")+'</span></div><div class="meta">'+esc(s.name||"Vendeur")+(isFeat(x)?' · <span class="tag">À la une jusqu\'au '+esc(dstr(x.featured_until))+'</span>':'')+'</div><div class="acts"><a class="btn alt sm" href="#/p/'+encodeURIComponent(x.id)+'">Voir</a><button class="btn alt sm" data-ft="'+esc(x.id)+'" data-d="7">À la une 7 j</button><button class="btn alt sm" data-ft="'+esc(x.id)+'" data-d="30">30 j</button>'+(isFeat(x)?'<button class="btn alt sm" data-ft="'+esc(x.id)+'" data-d="0">Retirer de la une</button>':'')+'<button class="btn alt sm" data-arm="'+esc(x.id)+'">Retirer</button></div></div></div>';
  }).join("")||'<p class="note">Aucun produit pour le moment.</p>';
  if(d.products.length>100||d.profiles.length>100)h+='<p class="note">Les 100 plus récents sont affichés.</p>';
  h+='<p class="note">Les e-mails des vendeurs se trouvent dans Supabase : menu « Authentication », puis « Users ».</p>';
  view.innerHTML=h;
  if(keep)window.scrollTo(0,keep);else $("ptitle").focus({preventScroll:true});
  $("back").onclick=function(){if(history.length>1)history.back();else location.hash="#/compte";};
  if($("rvgo"))$("rvgo").onclick=async function(){
    var amt=parseFloat($("rva").value),err=$("rverr");err.textContent="";
    if(!(amt>0)){err.textContent="Écris le montant reçu.";$("rva").focus();return;}
    var dt=$("rvd").value||new Date().toISOString().slice(0,10);
    this.disabled=true;
    try{await API.revAdd({kind:$("rvs").value,seller_label:$("rvn").value.trim().slice(0,80),amount:amt,currency:$("rvc").value,method:$("rvm").value,note:$("rvt").value.trim().slice(0,150),paid_at:dt});toast("Paiement enregistré.");showAdmin(routeId,window.scrollY);}
    catch(ex){err.textContent=friendly(ex);this.disabled=false;}
  };
  view.onclick=async function(e){
    var rd=e.target.closest("[data-rd]");
    if(rd){if(rd.getAttribute("data-c")!=="1"){rd.setAttribute("data-c","1");rd.textContent="Confirmer";setTimeout(function(){if(rd.isConnected){rd.removeAttribute("data-c");rd.textContent="Supprimer";}},4000);return;}rd.disabled=true;try{await API.revDel(rd.getAttribute("data-rd"));toast("Paiement supprimé.");showAdmin(routeId,window.scrollY);}catch(ex){toast(friendly(ex));rd.disabled=false;}return;}
    var vf=e.target.closest("[data-vf]"),ft=e.target.closest("[data-ft]");
    if(vf){vf.disabled=true;try{await API.adminVerify(vf.getAttribute("data-vf"),vf.getAttribute("data-v")==="1");S.loaded=false;toast(vf.getAttribute("data-v")==="1"?"Badge accordé.":"Badge retiré.");showAdmin(routeId,window.scrollY);}catch(ex){toast(friendly(ex));vf.disabled=false;}return;}
    if(ft){ft.disabled=true;var dd=+ft.getAttribute("data-d");try{await API.adminFeature(ft.getAttribute("data-ft"),dd);S.loaded=false;toast(dd>0?"Mis à la une pour "+dd+" jours.":"Retiré de la une.");showAdmin(routeId,window.scrollY);}catch(ex){toast(friendly(ex));ft.disabled=false;}return;}
    var rm=e.target.closest("[data-arm]");if(!rm)return;
    if(rm.getAttribute("data-c")!=="1"){rm.setAttribute("data-c","1");rm.textContent="Confirmer";rm.classList.add("bad");setTimeout(function(){if(rm.isConnected){rm.removeAttribute("data-c");rm.textContent="Retirer";rm.classList.remove("bad");}},4000);return;}
    var id=rm.getAttribute("data-arm"),old=d.products.filter(function(x){return x.id===id;})[0];
    rm.disabled=true;
    try{await API.remove(id);if(old)API.drop(old.photos||[]);S.loaded=false;toast("Produit retiré.");showAdmin(routeId);}
    catch(ex){toast(friendly(ex));rm.disabled=false;}
  };
}

/* ---------- Navigation ---------- */
function route(){
  var rid=++routeId,h=location.hash.replace(/^#\/?/,""),a=h.split("/"),r=a[0]||"";
  if(S.active)S.scroll=window.scrollY;
  S.active=(r==="");
  view.onclick=null;
  document.body.classList.remove("has-order");
  if(r==="")showHome();
  else if(r==="p"&&a[1])showDetail(decodeURIComponent(a[1]),rid);
  else if(r==="vendeur"&&a[1])showSeller(decodeURIComponent(a[1]),rid);
  else if(r==="compte")showAccount(rid);
  else if(r==="categories")showCategories();
  else if(r==="oubli")showForgot();
  else if(r==="reset")showReset();
  else if(r==="admin")showAdmin(rid);
  else if(r==="nouveau")showForm(null,rid);
  else if(r==="modifier"&&a[1])showForm(decodeURIComponent(a[1]),rid);
  else{location.hash="#/";return;}
  if(r!=="")window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-copy]");if(!b)return;
  var m=/^#\/p\/([^/]+)/.exec(location.hash);
  track("pay_copy",m?decodeURIComponent(m[1]):null,b.getAttribute("data-pay"));
  copy(b.getAttribute("data-copy")).then(function(ok){toast(ok?"Numéro copié.":"Copie le numéro à la main.");});
});
window.addEventListener("hashchange",route);
$("homeBtn").onclick=function(){if(location.hash&&location.hash!=="#/"&&location.hash!=="#"){location.hash="#/";}else{S.q="";S.cat="";S.loaded=false;showHome();window.scrollTo(0,0);}};
$("sellBtn").onclick=function(){location.hash="#/compte";};
banner();updateBar();route();trackVisit();
if(cur)API.me().then(function(m){if(m){cur=m;updateBar();}else if(session){/* session expirée */}}).catch(function(e){if(e&&(e.status===401||e.status===403)){saveSession(null);cur=null;updateBar();}});
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js");}}catch(e){}
})();
</script>
