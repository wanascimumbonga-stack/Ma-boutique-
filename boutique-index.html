<style>

.sph{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

function isJwt(k){return /^eyJ/.test(k);}
function headers(extra){
  var h={apikey:CFG.SUPABASE_KEY,"Content-Type":"application/json"};
  if(session&&session.access_token)h.Authorization="Bearer "+session.access_token;
  else if(isJwt(CFG.SUPABASE_KEY))h.Authorization="Bearer "+CFG.SUPABASE_KEY;
  for(var k in extra)h[k]=extra[k];
  return h;
}
function toSession(j){return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user&&j.user.id,email:j.user&&j.user.email}};}
async function fresh(){
  if(!session||!session.refresh_token||session.demo)return;
  if(session.expires_at*1000-Date.now()>60000)return;
  try{
    var r=await fetch(BASE+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:CFG.SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(r.ok){var j=await r.json();saveSession(toSession(j));}
    else if(r.status===400||r.status===401){saveSession(null);cur=null;}
  }catch(e){}
}
async function http(method,url,body,extra,raw){
  await fresh();
  var r;
  try{r=await fetch(url,{method:method,headers:headers(extra),body:raw?body:(body==null?undefined:JSON.stringify(body))});}
  catch(e){throw new Error("Pas de connexion. Vérifie ton internet et réessaie.");}
  if(!r.ok){
    var t="";try{var j=await r.json();t=j.message||j.msg||j.error_description||j.error||"";}catch(_){}
    var err=new Error(t||("Erreur "+r.status));err.status=r.status;throw err;
  }
  if(r.status===204)return null;
  var ct=r.headers.get("content-type")||"";
  return ct.indexOf("json")>=0?r.json():null;
}

function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var M=900,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,M/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error("Photo illisible."));},"image/jpeg",0.8);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Cette photo ne peut pas être lue. Essaie-en une autre."));};
    img.src=url;
  });
}

async function showDiscover(rid){
  document.body.classList.add("feedmode");

  feed.innerHTML='<div class="fempty">Chargement…</div>';

    if(!("IntersectionObserver" in window))return;
    if(!FEEDIO)FEEDIO=new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(!en.isIntersecting)return;
        var sl=en.target,id=sl.getAttribute("data-id");

    },{root:feed,threshold:0.6});
    Array.prototype.forEach.call(feed.querySelectorAll(".slide:not([data-w])"),function(sl){sl.setAttribute("data-w","1");FEEDIO.observe(sl);});
  }

      else F.tap=now;

/* ---------- Espace propriétaire ---------- */
function dstr(ts){return new Date(ts).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});}
function dayLbl(x){return new Date(x+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","");}
function chartSvg(daily){
  var mx=1;daily.forEach(function(x){mx=Math.max(mx,x.visitors,x.orders);});
  var H=104,top=18,gw=320/7,bw=14,g='<line class="ax" x1="0" x2="320" y1="'+(top+H)+'" y2="'+(top+H)+'"/>',alt=[];
  daily.forEach(function(x,i){
    var cx=gw*i+gw/2;
    [[x.visitors,"b1",cx-bw-1],[x.orders,"b2",cx+1]].forEach(function(v){
      var h=v[0]?Math.max(3,Math.round(H*v[0]/mx)):0;
      if(h)g+='<rect class="'+v[1]+'" x="'+v[2]+'" y="'+(top+H-h)+'" width="'+bw+'" height="'+h+'" rx="3"/>';
      if(v[0])g+='<text x="'+(v[2]+bw/2)+'" y="'+(top+H-h-4)+'" font-size="10" text-anchor="middle">'+v[0]+'</text>';
    });
    g+='<text x="'+cx+'" y="'+(top+H+16)+'" font-size="11" text-anchor="middle">'+esc(dayLbl(x.day))+'</text>';
    alt.push(dayLbl(x.day)+" : "+x.visitors+" visiteur(s), "+x.orders+" commande(s) lancée(s)");
  });
  return '<svg class="chart" viewBox="0 0 320 '+(top+H+24)+'" role="img" aria-label="'+esc("Visiteurs et commandes lancées sur 7 jours. "+alt.join(". "))+'">'+g+'</svg>'+
    '<div class="lg"><span><i style="background:var(--c1)"></i>Visiteurs</span><span><i style="background:var(--c2)"></i>Commandes lancées</span></div>';
}

    var ba=e.target.closest("[data-ba]");

    var bd=e.target.closest("[data-bd]"),br=e.target.closest("[data-br]");

    var rpd=e.target.closest("[data-rpd]"),rpx=e.target.closest("[data-rpx]");

    var ca=e.target.closest("[data-ca]");if(ca){ca.disabled=true;try{await API.adminClearAvatar(ca.getAttribute("data-ca"));toast("Photo retirée.");showAdmin(routeId,window.scrollY);}catch(ex){toast(friendly(ex));ca.disabled=false;}return;}
    var vf=e.target.closest("[data-vf]"),ft=e.target.closest("[data-ft]");

}


/* ---------- Wanasci Pay : paiement en ligne ---------- */
var WPU=String(CFG.WP_URL||"https://wanasci-pay.onrender.com").replace(/\/$/,"");
function wpMerchant(v){var m=payMap(v);if(!("wanasci" in m))return "";var n=String(m.wanasci||"").replace(/\D/g,"");return n&&n.length<=9?n:"";}
function wpList(){try{return JSON.parse(localStorage.getItem("mb_wp")||"[]");}catch(e){return [];}}
function wpSave(l){try{localStorage.setItem("mb_wp",JSON.stringify(l.slice(-20)));}catch(e){}}
async function wpUsd(p){
  var n=Number(p.price)||0;
  if(p.currency==="USD")return Math.round(n*100)/100;
  var rate=Number(CFG.WP_RATE)||2300;
  try{var r=await fetch(WPU+"/api/rates");var j=await r.json();if(j&&j.rates&&Number(j.rates.USD)>0)rate=Number(j.rates.USD);}catch(e){}
  return Math.ceil(n/rate*100)/100;
}
async function wpPay(p,s,id,btn){
  btn.disabled=true;
  try{
    var usd=await wpUsd(p);
    if(!(usd>=1)){toast("Le paiement en ligne commence à 1 $.");btn.disabled=false;return;}
    if(usd>500){toast("Maximum 500 $ par paiement en ligne.");btn.disabled=false;return;}
    var ref="MB"+String(p.id).replace(/[^A-Za-z0-9]/g,"").slice(0,8)+Date.now().toString(36);
    var l=wpList();l.push({ref:ref,pid:p.id,m:id,usd:usd,title:String(p.title||"").slice(0,80),wa:waNum(s.whatsapp)||"",at:Date.now()});wpSave(l);
    var back=location.origin+location.pathname+"#/retour";
    location.href=WPU+"/?m="+id+"&amount="+usd+"&ref="+ref+"&desc="+encodeURIComponent(String(p.title||"Commande").slice(0,50))+"&return="+encodeURIComponent(back);
  }catch(e){toast("Impossible d'ouvrir Wanasci Pay. Réessaie.");btn.disabled=false;}
}
function wpCatchReturn(){
  try{
    var q=new URLSearchParams(location.search),ref=q.get("wp_ref");
    if(!ref)return;
    S.wpRet={ref:ref,flag:q.get("wp_paid")};
    history.replaceState(null,"",location.pathname+"#/retour");
  }catch(e){}
}

/* ---------- Badge vérifié automatisé ---------- */
var BADGE_USD=3;
async function wpIdVerified(id){try{var r=await fetch(WPU+"/api/id-check?m="+encodeURIComponent(id));var j=await r.json();return j&&j.verified?1:(j&&j.exists?0:-1);}catch(e){return null;}}
async function badgeBlock(mine){
  var b=(mine||[]).filter(function(x){return x.kind==="badge";})[0];
  var P=CFG.PRO_PRICES||{};
  var head='<div class="offer"><h3>Badge vérifié ✔</h3><p style="margin:0">Le badge bleu rassure les acheteurs. Il est donné aux vendeurs dont l\'identité est vérifiée.</p><div class="pz">'+esc(P.badge||"3 $ par mois")+'</div>';
  if(b&&b.status==="open"&&!b.approved_at)return head+'<p class="note">⏳ Demande reçue. Le fondateur examine ton dossier. Tu seras prévenu ici dès que tu pourras payer.</p></div>';
  if(b&&b.status==="open"&&b.approved_at)return head+'<p class="note">✅ Ton dossier est accepté. Paie '+BADGE_USD+' $ avec Wanasci Pay : ton badge s\'active tout seul pour 30 jours.</p><button class="btn" data-bpay="'+esc(b.id)+'">Payer '+BADGE_USD+' $ avec Wanasci Pay</button></div>';
  var info={since:null,products:0};try{info=await API.badgeInfo();}catch(e){}
  var pay=wpMerchant((cur.profile||{}).payments),idv=pay?await wpIdVerified(pay):0;
  var age=info.since?Math.floor((Date.now()-new Date(info.since).getTime())/864e5):0;
  var c1=idv===1,c2=age>=14,c3=info.products>=3;
  function li(ok,t){return '<li>'+(ok?'✅ ':'❌ ')+t+'</li>';}
  var why=!pay?'Ajoute ton numéro Wanasci Pay dans ton compte (section paiements), puis vérifie ton identité dans l\'application Wanasci Pay.':idv===-1?'Ce numéro Wanasci Pay est introuvable. Corrige-le dans ton compte.':idv===null?'Impossible de joindre Wanasci Pay pour l\'instant.':'Dans Wanasci Pay : Profil → Vérification d\'identité.';
  var h=head+'<ul style="list-style:none;padding:0;margin:8px 0">'+li(c1,'Identité vérifiée dans Wanasci Pay')+li(c2,'Compte créé depuis au moins 14 jours (actuellement '+age+' j)')+li(c3,'Au moins 3 produits publiés (actuellement '+info.products+')')+'<li>🛡️ Aucun signalement ouvert contre toi (vérifié à l\'envoi)</li></ul>';
  if(!c1)h+='<p class="note">'+esc(why)+'</p>';
  h+='<button class="btn" data-bkb="1"'+(c1&&c2&&c3?'':' disabled')+'>Demander le badge</button></div>';
  return h;
}
async function badgePay(reqId,btn){
  btn.disabled=true;
  try{
    var fm=await API.founderPay();var m=wpMerchant(fm)||String(CFG.WP_BADGE_MERCHANT||"").replace(/\D/g,"");
    if(!m){toast("Le paiement du badge n'est pas encore prêt. Contacte le fondateur.");btn.disabled=false;return;}
    var ref="BDG"+String(reqId).replace(/[^A-Za-z0-9]/g,"").slice(0,24);
    var l=wpList();l.push({ref:ref,kind:"badge",req:String(reqId),m:m,usd:BADGE_USD,title:"Badge vérifié",at:Date.now()});wpSave(l);
    var back=location.origin+location.pathname+"#/retour";
    location.href=WPU+"/?m="+m+"&amount="+BADGE_USD+"&ref="+ref+"&desc="+encodeURIComponent("Badge vérifié (30 jours)")+"&return="+encodeURIComponent(back);
  }catch(e){toast("Impossible d'ouvrir Wanasci Pay. Réessaie.");btn.disabled=false;}
}
async function badgeReturn(rec,l,rid){
  var h='<h1 tabindex="-1" id="ptitle">Badge vérifié</h1>',back='<a class="btn alt" href="#/compte">Retour à mon compte</a>';
  view.innerHTML=h+'<p class="note">Vérification du paiement…</p>';
  if(!cur){renderAuth("login");return;}
  var d=null,bad="";
  try{var r=await fetch(WPU+"/api/pay-status?m="+encodeURIComponent(rec.m)+"&ref="+encodeURIComponent(rec.ref));d=await r.json();}catch(e){bad="Impossible de vérifier pour l'instant. Vérifie ta connexion.";}
  if(rid!==routeId)return;
  var mine=wpMerchant((cur.profile||{}).payments);
  if(d&&d.paid&&Number(d.amountCents)>=BADGE_USD*100){
    if(!d.payerVerified){h+='<div class="tip"><b>⚠️ Identité non vérifiée</b><br>Le compte qui a payé n\'a pas son identité vérifiée dans Wanasci Pay. Le badge n\'est pas activé. Contacte le fondateur.</div>'+back;}
    else if(String(d.payerId)!==String(mine)){h+='<div class="tip"><b>⚠️ Compte différent</b><br>Le paiement vient d\'un autre compte Wanasci Pay que celui indiqué dans ton profil. Le badge n\'est pas activé. Contacte le fondateur.</div>'+back;}
    else{
      try{if(!rec.done)await API.badgeActivate(rec.req,d.ref||rec.ref,d.payerId);rec.done=true;wpSave(l.map(function(x){return x.ref===rec.ref?rec:x;}));S.loaded=false;
        try{var m=await API.me();if(m)cur=m;}catch(e2){}
        h+='<div class="tip"><b>🎉 Paiement reçu — ton badge est actif</b><br>Il est valable 30 jours. Merci !</div>'+back;}
      catch(ex){h+='<div class="tip"><b>Paiement reçu, mais le badge n\'a pas pu s\'activer</b><br>'+esc(friendly(ex))+'<br>Ne repaie pas. Contacte le fondateur avec la référence '+esc(d.ref||rec.ref)+'.</div><button class="btn" id="wpretry">Réessayer</button>'+back;}
    }
  }else if(d&&d.paid){h+='<div class="tip"><b>⚠️ Montant insuffisant</b><br>Le badge coûte '+BADGE_USD+' $. Contacte le fondateur.</div>'+back;}
  else{h+='<div class="tip"><b>Paiement non terminé</b><br>'+esc(bad||"Nous n'avons pas trouvé de paiement. Si tu as payé il y a quelques secondes, réessaie.")+'</div><button class="btn" id="wpretry">Vérifier encore</button><a class="btn alt" href="'+WPU+"/?m="+esc(rec.m)+"&amount="+BADGE_USD+"&ref="+esc(rec.ref)+'">Payer maintenant</a>'+back;}
  view.innerHTML=h;var rt=$("wpretry");if(rt)rt.onclick=function(){badgeReturn(rec,wpList(),routeId);};
}
async function showReturn(rid){
  var ref=S.wpRet&&S.wpRet.ref,l=wpList(),rec=null;
  if(ref)rec=l.filter(function(x){return x.ref===ref;})[0];
  if(!rec&&l.length)rec=l[l.length-1];
  if(!rec){location.hash="#/";return;}
  if(rec.kind==="badge"){return badgeReturn(rec,l,rid);}
  view.innerHTML='<h1 tabindex="-1" id="ptitle">Paiement</h1><p class="note">Vérification du paiement…</p>';
  var d=null,bad="";
  try{var r=await fetch(WPU+"/api/pay-status?m="+encodeURIComponent(rec.m)+"&ref="+encodeURIComponent(rec.ref));d=await r.json();}catch(e){bad="Impossible de vérifier pour l'instant. Vérifie ta connexion.";}
  if(rid!==routeId)return;
  var h='<h1 tabindex="-1" id="ptitle">Paiement</h1>';
  var link='<a class="btn alt" href="#/p/'+encodeURIComponent(rec.pid)+'">Retour au produit</a>';
  if(d&&d.paid&&Number(d.amountCents)>=Math.round(rec.usd*100)){
    rec.paid=true;wpSave(l.map(function(x){return x.ref===rec.ref?rec:x;}));
    h+='<div class="tip"><b>✅ Paiement reçu</b><br>'+esc(rec.title)+' : <b>'+esc(String(rec.usd).replace(".",","))+' $</b><br>Référence : '+esc(rec.ref)+'</div>'+
      '<p class="note">Contacte maintenant le vendeur pour la livraison ou le retrait. Donne-lui la référence ci-dessus.</p>'+
      (rec.wa?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(rec.wa)+'?text='+encodeURIComponent("Bonjour, j'ai payé « "+rec.title+" » ("+rec.usd+" $) avec Wanasci Pay. Référence : "+rec.ref)+'">Écrire au vendeur sur WhatsApp</a>':'')+link;
  }else if(d&&d.paid){
    h+='<div class="tip"><b>⚠️ Montant différent</b><br>Un paiement existe pour cette commande, mais le montant est inférieur à '+esc(String(rec.usd).replace(".",","))+' $. Contacte le vendeur.</div>'+link;
  }else{
    h+='<div class="tip"><b>Paiement non terminé</b><br>'+esc(bad||"Nous n'avons pas trouvé de paiement pour cette commande. Si tu as payé il y a quelques secondes, réessaie.")+'</div><button class="btn" id="wpretry">Vérifier encore</button><a class="btn alt" href="'+WPU+"/?m="+esc(rec.m)+"&amount="+esc(rec.usd)+"&ref="+esc(rec.ref)+'">Payer maintenant</a>'+link;
  }
  view.innerHTML=h;
  var rt=$("wpretry");if(rt)rt.onclick=function(){showReturn(routeId);};
  var t=$("ptitle");try{t.focus({preventScroll:true});}catch(e){}
}

/* ---------- Navigation ---------- */
function route(){
  var rid=++routeId,h=location.hash.replace(/^#\/?/,""),a=h.split("/"),r=a[0]||"";
  if(S.active)S.scroll=window.scrollY;
  S.active=(r==="");
  view.onclick=null;
  if(S.mt){clearInterval(S.mt);S.mt=null;}
  document.body.classList.remove("has-order");document.body.classList.remove("feedmode");
  if(FEEDIO){FEEDIO.disconnect();FEEDIO=null;}
  if(r==="")showHome();
  else if(r==="p"&&a[1])showDetail(decodeURIComponent(a[1]),rid);
  else if(r==="decouvrir")showDiscover(rid);
  else if(r==="abonnements")showFollowing(rid);
  else if(r==="top")showTop(rid);
  else if(r==="vendeur"&&a[1])showSeller(decodeURIComponent(a[1]),rid);
  else if(r==="compte")showAccount(rid);
  else if(r==="categories")showCategories();
  else if(r==="oubli")showForgot();
  else if(r==="reset")showReset();
  else if(r==="conditions"||r==="confidentialite")showLegal(r);
  else if(r==="messages")showMessages(rid,a[1]?decodeURIComponent(a[1]):"");
  else if(r==="pro")showPro(rid);
  else if(r==="commandes")showOrders(rid);
  else if(r==="retour")showReturn(rid);
  else if(r==="admin")showAdmin(rid);
  else if(r==="nouveau")showForm(null,rid);
  else if(r==="modifier"&&a[1])showForm(decodeURIComponent(a[1]),rid);
  else{location.hash="#/";return;}
  if(r!=="")window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-copy]");if(!b)return;
  var m=/^#\/p\/([^/]+)/.exec(location.hash);
  track("pay_copy",m?decodeURIComponent(m[1]):null,b.getAttribute("data-pay"));

});
document.addEventListener("click",function(e){var b=e.target.closest("[data-fw]");if(!b)return;e.preventDefault();toggleFollow(b.getAttribute("data-fw"));});
window.addEventListener("hashchange",route);
$("homeBtn").onclick=function(){if(location.hash&&location.hash!=="#/"&&location.hash!=="#"){location.hash="#/";}else{S.q="";S.cat="";S.loaded=false;showHome();window.scrollTo(0,0);}};
$("sellBtn").onclick=function(){location.hash="#/compte";};
wpCatchReturn();banner();updateBar();route();trackVisit();setTimeout(checkNotifs,600);
if(cur)API.me().then(function(m){if(m){cur=m;updateBar();}else if(session){/* session expirée */}}).catch(function(e){if(e&&(e.status===401||e.status===403)){saveSession(null);cur=null;updateBar();}});
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register("sw.js");}}catch(e){}
})();
